name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25.4'
    
    - run: go test -v -coverprofile=coverage.out ./...
    
    - run: go tool cover -func=coverage.out
    
    - uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.out